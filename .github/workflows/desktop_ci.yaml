# https://github.com/tauri-apps/tauri-action/blob/3013cac/examples/test-build-only.yml
#
# The native jobs (macOS, Windows, Linux) are the slow ones, so pull requests
# and pushes get them only when they touch what those jobs build; `changes`
# decides, and `ci` counts a native job it skipped as passing. Schedule and
# manual runs always get them.
#
# Tests run on Linux unless they need macOS. MACOS_TESTS are the crates with
# macOS-specific code, or tests that reach it through a dependency; macos_ci
# tests them with the app. linux_ci tests the app and every other crate on
# Linux, where runners are plentiful and the Swift builds are stubs, except
# CLI_TESTS, which cli_ci tests, and SKIP_TESTS, which no job here tests. A
# crate tested on Linux can still fail only on macOS (case-insensitive file
# names, system behaviour outside `cfg`), so schedule and manual runs also test
# the whole workspace on macOS, as every run did before; such a failure shows
# up within a day.
#
# macOS is one job on purpose: hosted macOS runners are scarce here and a job
# left waiting for one is cancelled, so a run asks for a single runner. Its
# checks keep going after a failure, so that one run reports all of them.
#
# Only main saves Rust caches (rust_install), one per platform; everything else
# restores them, so a pull request can neither evict nor replace them. A cache
# is saved only under a new key, and the key does not cover the cargo commands,
# so bump a job's cache-key when you change what it builds.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
    paths:
      - .cargo/**
      - .github/actions/install_desktop_deps/**
      - .github/actions/rust_install/**
      - .github/workflows/desktop_ci.yaml
      - apps/cli/**
      - apps/desktop/**
      - packages/utils/**
      - plugins/**
      - crates/**
      - scripts/bash-guard.sh
      - scripts/setup-linux-others.sh
      - scripts/setup-linux-tauri.sh
      - skills/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:
    paths:
      - .cargo/**
      - .github/actions/install_desktop_deps/**
      - .github/actions/rust_install/**
      - .github/workflows/desktop_ci.yaml
      - apps/cli/**
      - apps/desktop/**
      - packages/utils/**
      - plugins/**
      - crates/**
      - scripts/bash-guard.sh
      - scripts/setup-linux-others.sh
      - scripts/setup-linux-tauri.sh
      - skills/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A run on main always finishes, so every merge leaves its caches behind.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # CI-only settings; local builds keep the profiles in Cargo.toml. Debug info
  # only slows linking and fills the runner's disk here.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Crates whose tests need macOS: macOS code or `cfg` branches, Swift, or a
  # dependency whose macOS behaviour the tests reach (local transcription,
  # capture, the app's macOS plugins). macos_ci tests them; linux_ci skips them.
  MACOS_TESTS: >-
    afconvert apple-todo audio-actual audio-norm detect dictation-ui-macos
    listener-core listener2-core local-model local-stt-core notification
    overlay-kit owhisper-client recording-environment shortcut-macos
    tauri-plugin-anlg-tray tauri-plugin-dictation tauri-plugin-dock
    tauri-plugin-shortcut tauri-plugin-todo tauri-plugin-transcription
    transcribe-soniqo transcribe-speechanalyzer transcription-core
  # Tested by cli_ci, whose paths cover them and their workspace dependencies.
  CLI_TESTS: agent-access db-app db-migrate librelog-cli tiptap
  # Built here but never tested here, as before.
  SKIP_TESTS: >-
    aec audio audio-device bundle db-core device-monitor frontmatter host
    intercept notification-linux notification-macos onnx pyannote-local
    tauri-plugin-apple-foundation tauri-plugin-deeplink2 tauri-plugin-detect
    tauri-plugin-fs-sync tauri-plugin-fs2 tauri-plugin-hooks tauri-plugin-icon
    tauri-plugin-local-auth tauri-plugin-local-stt tauri-plugin-misc
    tauri-plugin-notification tauri-plugin-notify tauri-plugin-opener2
    tauri-plugin-permissions tauri-plugin-settings tauri-plugin-sfx
    tauri-plugin-sidecar2 tauri-plugin-store2 tauri-plugin-tantivy
    tauri-plugin-tracing tauri-plugin-updater2 tauri-plugin-windows tcc
    transcribe-whisper-local vad vad-masking whisper whisper-local
    whisper-local-model

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.native.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: native
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # The inputs of the native builds; the workflow's paths must cover them.
          # docs/ is left out: only CLI tests read it, and cli_ci runs those.
          pattern='^(\.cargo|apps/cli|apps/desktop/src-tauri|crates|plugins|skills)/'
          pattern+='|^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$'
          pattern+='|^\.github/workflows/desktop_ci\.yaml$'
          pattern+='|^\.github/actions/(install_desktop_deps|rust_install)/'
          pattern+='|^scripts/(bash-guard|setup-linux-others|setup-linux-tauri)\.sh$'

          native=true
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]] &&
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # --no-renames lists both sides of a move.
            changed="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"
            matched="$(grep -E "$pattern" <<<"$changed" || true)"
            if [[ -z "$matched" ]]; then
              native=false
              echo "Nothing the native jobs build changed."
            else
              echo "Native jobs run for:"
              head -n 20 <<<"$matched"
            fi
          fi
          echo "native=$native" | tee -a "$GITHUB_OUTPUT"

  js_ci:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/pnpm_install
      - run: pnpm -F ui build
      - if: matrix.shard == 1
        run: pnpm -F desktop typecheck
      - env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: pnpm -F desktop test --shard="$SHARD/$SHARD_TOTAL"

  macos_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    env:
      FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/install_desktop_deps
        with:
          target: macos
      # Schedule and manual runs build more than pull requests do, so only
      # pushes save the cache that pull requests restore.
      - uses: $/.github/actions/rust_install
        with:
          platform: macos
          cache-key: desktop-v2
          save-cache: ${{ github.event_name == 'push' }}
      - id: setup
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      # Every check after setup runs even when an earlier one failed.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: swift build --package-path plugins/windows/swift-lib
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: swift test --package-path crates/dictation-ui-macos/swift-lib
      # The test build goes first so the long Soniqo Swift build in its build
      # script overlaps with compiling, not with waiting. Schedule and manual
      # runs test the macOS crates with the rest of the workspace below.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          packages=(-p desktop)
          if [[ "$FULL" != true ]]; then
            read -r -a crates <<<"$MACOS_TESTS"
            for crate in "${crates[@]}"; do packages+=(-p "$crate"); done
          fi
          cargo test --locked "${packages[@]}"
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo check --locked -p desktop --features direct-distribution
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo check --locked -p desktop --features app-store
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.FULL == 'true' }}
        run: cargo test --locked -p tauri-plugin-template --lib
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.FULL == 'true' }}
        run: |
          read -r -a skip <<<"$SKIP_TESTS"
          excludes=(--exclude desktop --exclude tauri-plugin-template)
          for crate in "${skip[@]}"; do excludes+=(--exclude "$crate"); done
          cargo test --locked --workspace "${excludes[@]}"
      # The build scripts regenerate these on every run, the tests only when
      # they run here (schedule and manual runs); linux_ci checks both.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          git diff --exit-code -- \
            plugins/db/js/bindings.gen.ts \
            plugins/db/permissions/autogenerated \
            plugins/db/permissions/schemas/schema.json

  windows_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/rust_install
        with:
          platform: windows
          cache-key: desktop
      # Builds every desktop target, so it also covers `cargo check -p desktop`.
      - run: cargo test --locked -p desktop --no-run
      - run: cargo test --locked -p tauri-plugin-notification --lib

  linux_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/install_desktop_deps
        with:
          target: linux
      - uses: $/.github/actions/rust_install
        with:
          platform: linux-x86_64
          cache-key: desktop-v2
      # The app and every crate outside MACOS_TESTS, CLI_TESTS and SKIP_TESTS.
      # Binding exports format only when prettier runs, and the committed
      # bindings are unformatted, so a stub hides any prettier on the image.
      - run: |
          mkdir -p "$RUNNER_TEMP/no-prettier"
          printf '#!/bin/sh\nexit 1\n' >"$RUNNER_TEMP/no-prettier/prettier"
          chmod +x "$RUNNER_TEMP/no-prettier/prettier"
          export PATH="$RUNNER_TEMP/no-prettier:$PATH"
          read -r -a skip <<<"$MACOS_TESTS $CLI_TESTS $SKIP_TESTS"
          excludes=()
          for crate in "${skip[@]}"; do excludes+=(--exclude "$crate"); done
          cargo test --locked --workspace "${excludes[@]}"
      # The tests and build scripts above regenerate these.
      - if: ${{ !cancelled() }}
        run: |
          git diff --exit-code -- \
            plugins/db/js/bindings.gen.ts \
            plugins/db/permissions/autogenerated \
            plugins/db/permissions/schemas/schema.json

  linux_arm_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/install_desktop_deps
        with:
          target: linux
      - uses: $/.github/actions/rust_install
        with:
          platform: linux-aarch64
          cache-key: desktop
      # The binary's test harness builds the library as a normal crate, so this
      # also covers `cargo check -p desktop`; only the library has these tests.
      - run: cargo test --locked --target aarch64-unknown-linux-gnu -p desktop --lib --bins embedded_cli

  desktop_i18n:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/pnpm_install
      - run: pnpm -F desktop i18n:check

  ci:
    if: always()
    needs: [
      changes,
      js_ci,
      macos_ci,
      windows_ci,
      linux_ci,
      linux_arm_ci,
      desktop_i18n,
    ]
    runs-on: ubuntu-latest
    steps:
      # Every job must succeed, except that the JS jobs skip blog/ branches and
      # the native jobs skip changes that do not touch what they build. A job
      # that never got a runner fails this, whatever result GitHub reports.
      - env:
          NEEDS: ${{ toJSON(needs) }}
          NATIVE: ${{ needs.changes.outputs.native }}
          BLOG: ${{ startsWith(github.head_ref || '', 'blog/') }}
        run: |
          status=0
          while read -r job result; do
            echo "$job: $result"
            case "$job:$result" in
              *:success) continue ;;
              js_ci:skipped | desktop_i18n:skipped) [[ "$BLOG" == true ]] && continue ;;
              changes:skipped) ;;
              *:skipped) [[ "$NATIVE" == true ]] || continue ;;
            esac
            echo "::error::$job finished with $result but had to succeed."
            status=1
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          exit "$status"
