# https://github.com/tauri-apps/tauri-action/blob/3013cac/examples/test-build-only.yml
#
# The native jobs (macOS, Windows, Linux) are the slow ones, so pull requests
# and pushes get them only when they touch what those jobs build; `changes`
# decides, and `ci` counts a native job it skipped as passing. Schedule and
# manual runs always get them.
#
# Tests run on Linux unless they need macOS. MACOS_TESTS are the crates with
# macOS-specific code, or tests that reach it through a dependency; macos_ci
# tests them with the app. MACOS_AND_LINUX_TESTS have code for both systems,
# so macos_ci tests them too while linux_ci keeps them. linux_ci tests the
# app and every other crate on Linux, where runners are plentiful and the
# Swift builds are stubs, except CLI_TESTS, which cli_ci tests, and
# SKIP_TESTS, which no job here tests. A crate tested on Linux can still fail
# only on macOS (case-insensitive file names, system behaviour outside `cfg`),
# so schedule and manual runs also test the whole workspace on macOS, as
# every run did before; such a failure shows up within a day.
#
# macOS is one job on purpose: hosted macOS runners are scarce here and a job
# left waiting for one is cancelled, so a run asks for a single runner. Its
# checks keep going after a failure, so that one run reports all of them.
# Each job builds its tests in one cargo invocation where it can: a different
# set of packages resolves different features and rebuilds the crates they
# share. windows_ci says why it cannot.
#
# Only main saves Rust caches (rust_install), one per platform; everything else
# restores them, so a pull request can neither evict nor replace them. A cache
# is saved only under a new key, and the key does not cover the cargo commands,
# so bump a job's cache-key when you change what it builds.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
    paths:
      - .cargo/**
      - .github/actions/install_desktop_deps/**
      - .github/actions/rust_install/**
      - .github/workflows/desktop_ci.yaml
      - apps/cli/**
      - apps/desktop/**
      - packages/utils/**
      - plugins/**
      - crates/**
      - scripts/bash-guard.sh
      - scripts/setup-linux-others.sh
      - scripts/setup-linux-tauri.sh
      - skills/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:
    paths:
      - .cargo/**
      - .github/actions/install_desktop_deps/**
      - .github/actions/rust_install/**
      - .github/workflows/desktop_ci.yaml
      - apps/cli/**
      - apps/desktop/**
      - packages/utils/**
      - plugins/**
      - crates/**
      - scripts/bash-guard.sh
      - scripts/setup-linux-others.sh
      - scripts/setup-linux-tauri.sh
      - skills/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A run on main always finishes, so every merge leaves its caches behind.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # CI-only settings; local builds keep the profiles in Cargo.toml. Debug info
  # only slows linking and fills the runner's disk here.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Crates whose tests need macOS: macOS code or `cfg` branches, Swift, or a
  # dependency whose macOS behaviour the tests reach (local transcription,
  # capture, the app's macOS plugins). macos_ci tests them; linux_ci skips them.
  MACOS_TESTS: >-
    afconvert apple-todo audio-actual audio-norm detect dictation-ui-macos
    listener-core listener2-core local-model local-stt-core notification
    overlay-kit owhisper-client recording-environment shortcut-macos
    tauri-plugin-anlg-tray tauri-plugin-dictation tauri-plugin-dock
    tauri-plugin-shortcut tauri-plugin-todo tauri-plugin-transcription
    transcribe-soniqo transcribe-speechanalyzer transcription-core
  # Tested by both macos_ci and linux_ci: transcribe-gguf builds transcribe.cpp
  # with Metal on macOS, and with Vulkan and a driver fingerprint on Linux.
  # macos_ci builds that Metal engine for the app anyway, so its tests add
  # little there.
  MACOS_AND_LINUX_TESTS: transcribe-gguf
  # Tested by cli_ci, whose paths cover them and their workspace dependencies.
  CLI_TESTS: agent-access db-app db-migrate librelog-cli tiptap
  # Built here but never tested here, as before.
  SKIP_TESTS: >-
    aec audio audio-device bundle db-core device-monitor frontmatter host
    intercept notification-linux notification-macos onnx pyannote-local
    tauri-plugin-apple-foundation tauri-plugin-deeplink2 tauri-plugin-detect
    tauri-plugin-fs-sync tauri-plugin-fs2 tauri-plugin-hooks tauri-plugin-icon
    tauri-plugin-local-auth tauri-plugin-misc tauri-plugin-notification
    tauri-plugin-notify tauri-plugin-opener2 tauri-plugin-permissions
    tauri-plugin-settings tauri-plugin-sfx tauri-plugin-sidecar2
    tauri-plugin-store2 tauri-plugin-tantivy tauri-plugin-tracing
    tauri-plugin-updater2 tauri-plugin-windows tcc vad vad-masking whisper
    whisper-local-model

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.native.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: native
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # The inputs of the native builds; the workflow's paths must cover them.
          # docs/ is left out: only CLI tests read it, and cli_ci runs those.
          pattern='^(\.cargo|apps/cli|apps/desktop/src-tauri|crates|plugins|skills)/'
          pattern+='|^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$'
          pattern+='|^\.github/workflows/desktop_ci\.yaml$'
          pattern+='|^\.github/actions/(install_desktop_deps|rust_install)/'
          pattern+='|^scripts/(bash-guard|setup-linux-others|setup-linux-tauri)\.sh$'

          native=true
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]] &&
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # --no-renames lists both sides of a move.
            changed="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"
            matched="$(grep -E "$pattern" <<<"$changed" || true)"
            if [[ -z "$matched" ]]; then
              native=false
              echo "Nothing the native jobs build changed."
            else
              echo "Native jobs run for:"
              head -n 20 <<<"$matched"
            fi
          fi
          echo "native=$native" | tee -a "$GITHUB_OUTPUT"

  js_ci:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/pnpm_install
      - run: pnpm -F ui build
      - if: matrix.shard == 1
        run: pnpm -F desktop typecheck
      - env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: pnpm -F desktop test --shard="$SHARD/$SHARD_TOTAL"

  macos_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    env:
      FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/install_desktop_deps
        with:
          target: macos
      # Schedule and manual runs build more than pull requests do, so only
      # pushes save the cache that pull requests restore.
      - uses: $/.github/actions/rust_install
        with:
          platform: macos
          cache-key: desktop-v2
          save-cache: ${{ github.event_name == 'push' }}
      - id: setup
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      # Every check after setup runs even when an earlier one failed.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: swift build --package-path plugins/windows/swift-lib
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: swift test --package-path crates/dictation-ui-macos/swift-lib
      # The test build goes first so the long Soniqo Swift build in its build
      # script overlaps with compiling, not with waiting. Schedule and manual
      # runs test the macOS crates with the rest of the workspace below.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          packages=(-p desktop)
          if [[ "$FULL" != true ]]; then
            read -r -a crates <<<"$MACOS_TESTS $MACOS_AND_LINUX_TESTS"
            for crate in "${crates[@]}"; do packages+=(-p "$crate"); done
          fi
          cargo test --locked "${packages[@]}"
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo check --locked -p desktop --features direct-distribution
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo check --locked -p desktop --features app-store
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.FULL == 'true' }}
        run: cargo test --locked -p tauri-plugin-template --lib
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.FULL == 'true' }}
        run: |
          read -r -a skip <<<"$SKIP_TESTS"
          excludes=(--exclude desktop --exclude tauri-plugin-template)
          for crate in "${skip[@]}"; do excludes+=(--exclude "$crate"); done
          cargo test --locked --workspace "${excludes[@]}"
      # The build scripts regenerate these on every run, the tests only when
      # they run here (schedule and manual runs); linux_ci checks both.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          git diff --exit-code -- \
            plugins/db/js/bindings.gen.ts \
            plugins/db/permissions/autogenerated \
            plugins/db/permissions/schemas/schema.json

  windows_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/rust_install
        with:
          platform: windows
          cache-key: desktop
      # transcribe.cpp's Vulkan backend (tauri-plugin-local-stt/gguf-vulkan)
      # builds against the Vulkan SDK (headers, loader import library, glslc)
      # and the SPIR-V headers' CMake package. These come after rust_install,
      # whose cache key would otherwise take in CMAKE_PREFIX_PATH.
      - uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      - run: |
          vcpkg_root="$(cygpath -u "$VCPKG_INSTALLATION_ROOT")"
          "$vcpkg_root/vcpkg" install spirv-headers:x64-windows
          echo "CMAKE_PREFIX_PATH=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows" >>"$GITHUB_ENV"
      # Builds every desktop test target, so it also covers `cargo check -p
      # desktop`, but runs none: the desktop test executables fail to load on
      # the Windows runner (STATUS_ENTRYPOINT_NOT_FOUND, 0xc0000139) before any
      # test starts. The notification plugin's test therefore gets its own
      # build. Built with the desktop's features it would link tauri's tray
      # icon support, which may fail to load the same way; its own build costs
      # about 4.5 minutes on a cold cache and seconds on a warm one.
      - run: |
          cargo test --locked -p desktop --no-run --message-format=json-render-diagnostics \
            >"$(cygpath -u "$RUNNER_TEMP")/desktop-tests.jsonl"
      # vulkan-1.dll comes with GPU drivers, not with Windows, so the app may
      # only delay-load it (apps/desktop/src-tauri/build.rs): a direct import
      # would keep it from starting on a computer without one. The desktop
      # test executables link like the app.
      - run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          dumpbin="$("$vswhere" -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | tr -d '\r' | sed -n 1p)"
          [[ -n "$dumpbin" ]] || { echo "::error::dumpbin.exe not found"; exit 1; }
          dumpbin="$(cygpath -u "$dumpbin")"
          mapfile -t executables < <(
            jq -r 'select(.executable != null) | .executable' \
              <"$(cygpath -u "$RUNNER_TEMP")/desktop-tests.jsonl" | tr -d '\r'
          )
          [[ ${#executables[@]} -gt 0 ]] || { echo "::error::no desktop test executables"; exit 1; }
          delay_loaded=false
          for executable in "${executables[@]}"; do
            dependents="$("$dumpbin" -nologo -dependents "$executable" | tr -d '\r')"
            echo "$dependents"
            if awk '/delay load dependencies/ { exit } tolower($0) ~ /vulkan-1\.dll/ { found = 1 } END { exit !found }' <<<"$dependents"; then
              echo "::error::$executable imports vulkan-1.dll directly"
              exit 1
            fi
            if grep -qi 'vulkan-1\.dll' <<<"$dependents"; then delay_loaded=true; fi
          done
          [[ "$delay_loaded" == true ]] || { echo "::error::no desktop test executable links vulkan-1.dll"; exit 1; }
      - run: cargo test --locked -p tauri-plugin-notification --lib

  linux_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/install_desktop_deps
        with:
          target: linux
      - uses: $/.github/actions/rust_install
        with:
          platform: linux-x86_64
          cache-key: desktop-v2
      # The built-in model server's end-to-end tests
      # (crates/local-llm/tests/llama_server.rs) run in the next step against
      # llama.cpp's own Ubuntu build and a 1 MB model, both pinned by SHA-256.
      # If a download fails they skip themselves, with a warning here; a
      # hash mismatch fails the job.
      - env:
          LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12110/llama-b12110-bin-ubuntu-x64.tar.gz
          LLAMA_SHA256: 368227edcc229be5f9bed16a2223d79b5e41d0ac2e19bcf5825e82291c060e55
          MODEL_URL: https://huggingface.co/ggml-org/test-model-stories260K/resolve/479896ec924af6d40fd419ab8f4d1eb2101de00d/stories260K-f32.gguf
          MODEL_SHA256: 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d
        run: |
          dir="$RUNNER_TEMP/llama"
          mkdir -p "$dir"
          if ! curl -fsSL --retry 3 -o "$dir/llama.tar.gz" "$LLAMA_URL" ||
            ! curl -fsSL --retry 3 -o "$dir/model.gguf" "$MODEL_URL"; then
            echo "::warning::Could not download llama-server or its test model; the built-in model end-to-end tests skip."
            exit 0
          fi
          echo "$LLAMA_SHA256  $dir/llama.tar.gz" | sha256sum --check --strict
          echo "$MODEL_SHA256  $dir/model.gguf" | sha256sum --check --strict
          tar -xzf "$dir/llama.tar.gz" -C "$dir"
          {
            echo "LIBRELOG_LLAMA_SERVER=$dir/llama-b12110/llama-server"
            echo "LIBRELOG_LLAMA_TEST_MODEL=$dir/model.gguf"
          } >>"$GITHUB_ENV"
      # The app and every crate outside MACOS_TESTS, CLI_TESTS and SKIP_TESTS.
      # Binding exports format only when prettier runs, and the committed
      # bindings are unformatted, so a stub hides any prettier on the image.
      - run: |
          mkdir -p "$RUNNER_TEMP/no-prettier"
          printf '#!/bin/sh\nexit 1\n' >"$RUNNER_TEMP/no-prettier/prettier"
          chmod +x "$RUNNER_TEMP/no-prettier/prettier"
          export PATH="$RUNNER_TEMP/no-prettier:$PATH"
          read -r -a skip <<<"$MACOS_TESTS $CLI_TESTS $SKIP_TESTS"
          excludes=()
          for crate in "${skip[@]}"; do excludes+=(--exclude "$crate"); done
          cargo test --locked --workspace "${excludes[@]}"
      # The tests and build scripts above regenerate these.
      - if: ${{ !cancelled() }}
        run: |
          git diff --exit-code -- \
            plugins/db/js/bindings.gen.ts \
            plugins/db/permissions/autogenerated \
            plugins/db/permissions/schemas/schema.json

  linux_arm_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/install_desktop_deps
        with:
          target: linux
      - uses: $/.github/actions/rust_install
        with:
          platform: linux-aarch64
          cache-key: desktop
      # The binary's test harness builds the library as a normal crate, so this
      # also covers `cargo check -p desktop`; only the library has these tests.
      - run: cargo test --locked --target aarch64-unknown-linux-gnu -p desktop --lib --bins embedded_cli

  desktop_i18n:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/pnpm_install
      - run: pnpm -F desktop i18n:check

  ci:
    if: always()
    needs: [
      changes,
      js_ci,
      macos_ci,
      windows_ci,
      linux_ci,
      linux_arm_ci,
      desktop_i18n,
    ]
    runs-on: ubuntu-latest
    steps:
      # Every job must succeed, except that the JS jobs skip blog/ branches and
      # the native jobs skip changes that do not touch what they build. A job
      # that never got a runner fails this, whatever result GitHub reports.
      - env:
          NEEDS: ${{ toJSON(needs) }}
          NATIVE: ${{ needs.changes.outputs.native }}
          BLOG: ${{ startsWith(github.head_ref || '', 'blog/') }}
        run: |
          status=0
          while read -r job result; do
            echo "$job: $result"
            case "$job:$result" in
              *:success) continue ;;
              js_ci:skipped | desktop_i18n:skipped) [[ "$BLOG" == true ]] && continue ;;
              changes:skipped) ;;
              *:skipped) [[ "$NATIVE" == true ]] || continue ;;
            esac
            echo "::error::$job finished with $result but had to succeed."
            status=1
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          exit "$status"
