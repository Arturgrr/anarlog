# https://github.com/tauri-apps/tauri-action/blob/3013cac/examples/test-build-only.yml
#
# The native jobs (macOS, Windows, Linux) take up to an hour each, so pull
# requests and pushes get them only when they touch what those jobs build;
# `changes` decides, and `ci` counts a native job it skipped as passing.
# Schedule and manual runs always get them.
#
# macOS is one job on purpose: hosted macOS runners are scarce here and a job
# left waiting for one is cancelled, so a run asks for a single runner. Its
# checks keep going after a failure, so that one run reports all of them.
# Windows and Linux build their tests once instead of checking first.
#
# Only main saves Rust caches (rust_install), one per platform; everything else
# restores them, so a pull request can neither evict nor replace them.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches:
      - main
    paths:
      - .cargo/**
      - .github/actions/install_desktop_deps/**
      - .github/actions/rust_install/**
      - .github/workflows/desktop_ci.yaml
      - apps/cli/**
      - apps/desktop/**
      - packages/utils/**
      - plugins/**
      - crates/**
      - scripts/bash-guard.sh
      - scripts/setup-linux-others.sh
      - scripts/setup-linux-tauri.sh
      - skills/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:
    paths:
      - .cargo/**
      - .github/actions/install_desktop_deps/**
      - .github/actions/rust_install/**
      - .github/workflows/desktop_ci.yaml
      - apps/cli/**
      - apps/desktop/**
      - packages/utils/**
      - plugins/**
      - crates/**
      - scripts/bash-guard.sh
      - scripts/setup-linux-others.sh
      - scripts/setup-linux-tauri.sh
      - skills/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A run on main always finishes, so every merge leaves its caches behind.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # CI-only settings; local builds keep the profiles in Cargo.toml. Debug info
  # only slows linking and fills the runner's disk here.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.native.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: native
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # The inputs of the native builds; the workflow's paths must cover them.
          # docs/ is left out: only CLI tests read it, and cli_ci runs those.
          pattern='^(\.cargo|apps/cli|apps/desktop/src-tauri|crates|plugins|skills)/'
          pattern+='|^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$'
          pattern+='|^\.github/workflows/desktop_ci\.yaml$'
          pattern+='|^\.github/actions/(install_desktop_deps|rust_install)/'
          pattern+='|^scripts/(bash-guard|setup-linux-others|setup-linux-tauri)\.sh$'

          native=true
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]] &&
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # --no-renames lists both sides of a move.
            changed="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"
            matched="$(grep -E "$pattern" <<<"$changed" || true)"
            if [[ -z "$matched" ]]; then
              native=false
              echo "Nothing the native jobs build changed."
            else
              echo "Native jobs run for:"
              head -n 20 <<<"$matched"
            fi
          fi
          echo "native=$native" | tee -a "$GITHUB_OUTPUT"

  js_ci:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/pnpm_install
      - run: pnpm -F ui build
      - if: matrix.shard == 1
        run: pnpm -F desktop typecheck
      - env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: pnpm -F desktop test --shard="$SHARD/$SHARD_TOTAL"

  macos_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/install_desktop_deps
        with:
          target: macos
      - uses: $/.github/actions/rust_install
        with:
          platform: macos
          cache-key: desktop
      - id: setup
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      # Every check after setup runs even when an earlier one failed.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: swift build --package-path plugins/windows/swift-lib
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: swift test --package-path crates/dictation-ui-macos/swift-lib
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo check --locked -p desktop --features direct-distribution
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo check --locked -p desktop --features app-store
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo test --locked -p desktop
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo test --locked -p tauri-plugin-template --lib
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cargo test --locked --workspace \
            --exclude desktop \
            --exclude control-tauri \
            --exclude ai \
            --exclude lago \
            --exclude notch \
            --exclude notification-macos \
            --exclude tcc \
            --exclude notification-linux \
            --exclude am \
            --exclude aec \
            --exclude whisper \
            --exclude whisper-local \
            --exclude whisper-local-model \
            --exclude vad2 \
            --exclude vad \
            --exclude vvad \
            --exclude vad-masking \
            --exclude vad-chunking \
            --exclude onnx \
            --exclude pyannote-local \
            --exclude llama \
            --exclude tools \
            --exclude bundle \
            --exclude host \
            --exclude intercept \
            --exclude frontmatter \
            --exclude audio \
            --exclude audio-device \
            --exclude transcribe-whisper-local \
            --exclude device-monitor \
            --exclude tauri-plugin-analytics \
            --exclude tauri-plugin-auth \
            --exclude tauri-plugin-db2 \
            --exclude tauri-plugin-deeplink2 \
            --exclude tauri-plugin-detect \
            --exclude tauri-plugin-fs-db \
            --exclude tauri-plugin-fs-sync \
            --exclude tauri-plugin-fs2 \
            --exclude tauri-plugin-hooks \
            --exclude tauri-plugin-icon \
            --exclude tauri-plugin-listener \
            --exclude tauri-plugin-listener2 \
            --exclude tauri-plugin-local-auth \
            --exclude tauri-plugin-apple-foundation \
            --exclude tauri-plugin-local-stt \
            --exclude tauri-plugin-misc \
            --exclude tauri-plugin-notification \
            --exclude tauri-plugin-notify \
            --exclude tauri-plugin-opener2 \
            --exclude tauri-plugin-pdf \
            --exclude tauri-plugin-permissions \
            --exclude tauri-plugin-settings \
            --exclude tauri-plugin-sfx \
            --exclude tauri-plugin-sidecar2 \
            --exclude tauri-plugin-store2 \
            --exclude tauri-plugin-tantivy \
            --exclude tauri-plugin-template \
            --exclude tauri-plugin-tracing \
            --exclude tauri-plugin-tray \
            --exclude tauri-plugin-updater2 \
            --exclude tauri-plugin-windows \
            --exclude db3 \
            --exclude db-core \
            --exclude activity-capture-macos \
            --exclude tauri-plugin-activity-capture
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          git diff --exit-code -- \
            plugins/db/js/bindings.gen.ts \
            plugins/db/permissions/autogenerated \
            plugins/db/permissions/schemas/schema.json

  windows_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/rust_install
        with:
          platform: windows
          cache-key: desktop
      # Builds every desktop target, so it also covers `cargo check -p desktop`.
      - run: cargo test --locked -p desktop --no-run
      - run: cargo test --locked -p tauri-plugin-notification --lib

  linux_ci:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust_platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/install_desktop_deps
        with:
          target: linux
      - uses: $/.github/actions/rust_install
        with:
          platform: ${{ matrix.rust_platform }}
          cache-key: desktop
      # The binary's test harness builds the library as a normal crate, so this
      # also covers `cargo check -p desktop`; only the library has these tests.
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --target "$TARGET" -p desktop --lib --bins embedded_cli

  desktop_i18n:
    if: ${{ !startsWith(github.head_ref || '', 'blog/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/pnpm_install
      - run: pnpm -F desktop i18n:check

  ci:
    if: always()
    needs: [
      changes,
      js_ci,
      macos_ci,
      windows_ci,
      linux_ci,
      desktop_i18n,
    ]
    runs-on: ubuntu-latest
    steps:
      # Every job must succeed, except that the JS jobs skip blog/ branches and
      # the native jobs skip changes that do not touch what they build. A job
      # that never got a runner fails this, whatever result GitHub reports.
      - env:
          NEEDS: ${{ toJSON(needs) }}
          NATIVE: ${{ needs.changes.outputs.native }}
          BLOG: ${{ startsWith(github.head_ref || '', 'blog/') }}
        run: |
          status=0
          while read -r job result; do
            echo "$job: $result"
            case "$job:$result" in
              *:success) continue ;;
              js_ci:skipped | desktop_i18n:skipped) [[ "$BLOG" == true ]] && continue ;;
              changes:skipped) ;;
              *:skipped) [[ "$NATIVE" == true ]] || continue ;;
            esac
            echo "::error::$job finished with $result but had to succeed."
            status=1
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          exit "$status"
