name: Feedback or feature request
description: Share an idea, something that feels off, or something that works well.
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback?
      options:
        - Idea or feature request
        - Something is confusing or slow
        - Something works well
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What were you trying to do, and how could Librelog help?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Librelog version
      placeholder: 0.1.0-beta.1
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5 Sequoia
  - type: input
    id: chip
    attributes:
      label: Mac chip
      placeholder: Apple silicon (arm64 build)
