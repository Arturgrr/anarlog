[package]
name = "recording-environment"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Pausing a browser on macOS sends commands through the private MediaRemote
# framework and checks System Audio Recording consent through private TCC.
macos-private-api = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSRunningApplication", "NSWorkspace", "libc"] }
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = { workspace = true, features = ["CFDictionary", "CFString"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSDictionary", "NSString", "NSUUID", "NSValue"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Variant"] }

[dev-dependencies]
tempfile = { workspace = true }
