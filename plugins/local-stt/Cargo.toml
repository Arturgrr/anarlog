[package]
name = "tauri-plugin-local-stt"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-local-stt"
description = ""

[features]
default = []
# transcribe.cpp models (GGUF and whisper.cpp files) through the internal
# /v1/listen server, on the CPU.
gguf = ["dep:anlg-transcribe-gguf", "dep:anlg-transcribe-gguf-local"]
gguf-metal = ["gguf", "anlg-transcribe-gguf/metal"]
gguf-vulkan = ["gguf", "anlg-transcribe-gguf/vulkan"]
[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
anlg-data = { workspace = true }

dirs = { workspace = true }
reqwest = { workspace = true }
rodio = { workspace = true }
similar = { workspace = true }
specta-typescript = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }

[dependencies]
anlg-file = { workspace = true }
anlg-gguf-model = { workspace = true }
anlg-host = { workspace = true }
anlg-local-model = { workspace = true }
anlg-local-stt-core = { workspace = true, features = ["specta"] }
anlg-model-downloader = { workspace = true, features = ["specta"] }
anlg-transcribe-soniqo = { workspace = true }
anlg-transcribe-speechanalyzer = { workspace = true }
anlg-transcribe-gguf = { workspace = true, optional = true }
anlg-transcribe-gguf-local = { workspace = true, optional = true }
anlg-whisper-local-model = { workspace = true }

tauri = { workspace = true, features = ["test"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

tauri-plugin-db = { workspace = true }
tauri-plugin-settings = { workspace = true }

dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
specta = { workspace = true }
thiserror = { workspace = true }

axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["cors", "trace"] }

reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

anlg-supervisor = { workspace = true }
ractor = { workspace = true, features = ["async-trait"] }
